---
# SR live streams (AAC 320 kbps), resolved via channel id:
# https://api.sr.se/api/v2/channels?liveaudiotemplateid=3&audioquality=hi
# The plain <id>.mp3 URLs are only 96 kbps MP3.
sr_radio_channels:
  p1:
    name: P1
    url: https://www.sverigesradio.se/topsy/direkt/srapi/132-hi-aac-http.pls
  p2:
    name: P2
    url: https://www.sverigesradio.se/topsy/direkt/srapi/163-hi-aac-http.pls
  p3:
    name: P3
    url: https://www.sverigesradio.se/topsy/direkt/srapi/164-hi-aac-http.pls
  p4stockholm:
    name: P4 Stockholm
    url: https://www.sverigesradio.se/topsy/direkt/srapi/701-hi-aac-http.pls

sr_radio_default_channel: p4stockholm
sr_radio_api_port: 8090

# mpv audio output device; empty string = system default sink.
# List devices on the pi: mpv --audio-device=help
# This pins playback to the built-in 3.5mm jack (aux) so it does not follow
# the default sink (e.g. the USB sound card).
sr_radio_audio_device: pipewire/alsa_output.platform-fe00b840.mailbox.stereo-fallback
